# 1 CONTAINER MINIO

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # PORT API S3
      - "9001:9001"   # PORT Web Console 
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secretsecret
    volumes:
      - ./minio:/data
    command: server /data --console-address ":9001"
    networks:
      - docker_network

networks:
  docker_network:
    driver: bridge